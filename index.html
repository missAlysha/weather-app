<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <div class="mainHeading">
    <h1>Weather App by <br>AlyshaSajidGul</h1> <br>
    <p>This app shows weather conditions</p>
 </div>
 <div class="searchbar">
    <input type="text" placeholder="Enter name here" id="search">
    <button id="searchBtn">Search here</button>
 </div>
 <div class="weatherCard">
    <div class="weather">
        <p id="cityName">Karachi | Pakistan</p>
    <h1 id="temperature">28°C</h1>
    </div>
     <img src="clouds-and-sun.png" alt="Sunny weather" class="weatherIcon">
    <div class="weatherDetails">
    <div>
        <p>Humidity</p>
         <h2 id="humidity">65%</h2>
</div>
    <div>
        <p>Wind Speed</p>
        <h2 id="windSpeed">18km/h</h2>
 </div>
   </div> 
         </div>

    <script src="script.js"></script>
</body>
</html>
